name: Java Execution Service Test

on:
  push:
    branches:
      - "backend-rework"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code (backend-rework)
        uses: actions/checkout@v7
        with:
          ref: backend-rework

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        working-directory: codehorn-backend
        run: chmod +x gradlew

      - name: Run Tests with Console Output
        working-directory: codehorn-backend
        run: ./gradlew :java-execution-service:test --info --console=plain
