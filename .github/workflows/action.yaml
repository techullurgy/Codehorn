name: Code Execution Service Test

on:
  push:
    branches:
      - "backend-rework"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code (backend-rework)
        uses: actions/checkout@v7
        with:
          ref: backend-rework

      - name: Gradle Wrapper Properties Changes
        run: |
          cat <<EOF > codehorn-backend/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionSha256Sum=92c1a136d76b5017732a66d2e0a648ebff00dd3687d8bff0d0047a1bd904fdf2
          distributionUrl=https://services.gradle.org/distributions/gradle-9.7.1-all.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        working-directory: codehorn-backend
        run: chmod +x gradlew

      - name: Pre Pull Docker Dind
        run: docker pull docker:29.8.2-dind

      - parallel:
#         - name: Run Java Tests with Console Output
#           working-directory: codehorn-backend
#           run: ./gradlew :java-execution-service:test --console=plain --no-daemon
#
#         - name: Run Cpp Tests with Console Output
#           working-directory: codehorn-backend
#           run: ./gradlew :cpp-execution-service:test --console=plain --no-daemon
#
#         - name: Run Python Tests with Console Output
#           working-directory: codehorn-backend
#           run: ./gradlew :python-execution-service:test --console=plain --no-daemon

        - name: Run Javascript Tests with Console Output
          working-directory: codehorn-backend
          run: ./gradlew :javascript-execution-service:test --console=plain --no-daemon
